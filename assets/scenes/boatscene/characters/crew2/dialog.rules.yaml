rules:
  - when:
      all:
        - mission_storageLantern
        - storageLantern_fairies_released
    script: assets/scenes/boatscene/characters/crew2/dialog_fairies.lua

  - when:
      all:
        - mission_storageLantern
        - storageLantern_has_lantern
    script: assets/scenes/boatscene/characters/crew2/dialog_has_lantern.lua

  - when:
      all:
        - mission_storageLantern
        - storageBattle_triggered
    script: assets/scenes/boatscene/characters/crew2/dialog_after_battle.lua

  - when:
      all:
        - mission_storageLantern
        - storageLantern_door_open
    script: assets/scenes/boatscene/characters/crew2/dialog_door_open.lua

  - when:
      all:
        - mission_storageLantern
        - storageLantern_has_doorKey
    script: assets/scenes/boatscene/characters/crew2/dialog_has_key.lua

  - when:
      all:
        - mission_storageLantern
    script: assets/scenes/boatscene/characters/crew2/dialog_stowaways.lua

  - script: assets/scenes/boatscene/characters/crew2/dialog_idle.lua
